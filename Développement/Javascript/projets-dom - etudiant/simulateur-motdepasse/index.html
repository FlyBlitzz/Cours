<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de mot de passe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="conteneur">
        <section class="generateur">
            <h1>Générateur de mot de passe</h1>

            <div class="groupe-controle">
                <div class="ligne-label">
                    <label for="longueur">Longueur du mot de passe</label>
                    <span id="affichageLongueur">12 caractères</span>
                </div>

                <input 
                    type="range" 
                    id="longueur" 
                    min="4" 
                    max="30" 
                    value="12"
                >
            </div>

            <div class="options">
                <h2>Options</h2>

                <label class="option">
                    <input type="checkbox" id="optionMinuscules" checked>
                    Inclure des minuscules
                </label>

                <label class="option">
                    <input type="checkbox" id="optionMajuscules" checked>
                    Inclure des majuscules
                </label>

                <label class="option">
                    <input type="checkbox" id="optionChiffres" checked>
                    Inclure des chiffres
                </label>

                <label class="option">
                    <input type="checkbox" id="optionSymboles">
                    Inclure des symboles
                </label>
            </div>

            <button id="boutonGenerer" type="button">
                Générer un mot de passe
            </button>

            <div class="resultat">
                <p>Mot de passe généré</p>
                <strong id="motDePasse">Cliquez sur le bouton</strong>
            </div>

            <p id="messageErreur" class="erreur"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
