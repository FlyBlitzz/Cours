<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur de placement</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="conteneur">
        <section class="simulateur">
            <h1>Simulateur de placement</h1>

            <p class="formule">
                A = P × (1 + r)<sup>t</sup>
            </p>

            <div class="groupe-controle">
                <div class="ligne-label">
                    <label for="capital">Capital placé</label>
                    <span id="affichageCapital">10 000 €</span>
                </div>

                <input
                    type="range"
                    id="capital"
                    min="1000"
                    max="100000"
                    step="500"
                    value="10000"
                >
            </div>

            <div class="groupe-controle">
                <div class="ligne-label">
                    <label for="taux">Taux annuel</label>
                    <span id="affichageTaux">3 %</span>
                </div>

                <input
                    type="range"
                    id="taux"
                    min="0"
                    max="20"
                    step="0.1"
                    value="3"
                >
            </div>

            <div class="groupe-controle">
                <div class="ligne-label">
                    <label for="duree">Durée du placement</label>
                    <span id="affichageDuree">5 ans</span>
                </div>

                <input
                    type="range"
                    id="duree"
                    min="1"
                    max="30"
                    step="1"
                    value="5"
                >
            </div>

            <div class="resultat">
                <p>Capital final obtenu</p>
                <strong id="affichageCapitalFinal">0 €</strong>
            </div>

            <div class="interets">
                <p>Intérêts générés</p>
                <strong id="affichageInterets">0 €</strong>
            </div>

            <div class="synthese">
                <p id="phraseSynthese"></p>
            </div>
        </section>
    </main>

    <script src="app-save.js"></script>
</body>
</html>
